name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: install
        working-directory: ui
        run: npm ci
      - name: build
        working-directory: ui
        run: npm run build
      - name: ensure static assets committed
        run: |
          git add -A crates/railspan-server/static
          git diff --cached --exit-code -- crates/railspan-server/static \
            || (echo "UI source changed but crates/railspan-server/static is stale. Run: cd ui && npm run build" && exit 1)

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: gem/railspan
      - name: test
        working-directory: gem/railspan
        run: bundle exec rake test
      - name: overhead microbench
        run: ruby scripts/bench_overhead.rb 20000
